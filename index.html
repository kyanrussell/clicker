<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Counter</title>
  <style>
    body {
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #1a1a1a;
      color: #eee;
      gap: 4vw;
      overflow: hidden;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 3vw;
    }

    input[type="text"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #eee;
      font-family: monospace;
      font-size: 4vw;
      padding: 1vw 1.5vw;
      width: 28vw;
      border-radius: 0.5vw;
    }

    .count {
      font-size: 8vw;
      width: 12vw;
      text-align: center;
    }

    .key-hint {
      font-size: 2.5vw;
      color: #666;
      width: 3vw;
      text-align: center;
    }

    button {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #eee;
      font-family: monospace;
      font-size: 3vw;
      padding: 1vw 2vw;
      border-radius: 0.5vw;
      cursor: pointer;
    }

    button:active {
      background: #3a3a3a;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      font-size: 0.85rem;
      color: #aaa;
      opacity: 0;
      transition: opacity 0.2s;
    }
  </style>
</head>
<body>

  <div class="row">
    <input type="text" id="label0" placeholder="label" value="">
    <span class="count" id="count0">0</span>
    <span class="key-hint">q</span>
    <button onclick="copy(0)">copy</button>
  </div>

  <div class="row">
    <input type="text" id="label1" placeholder="label" value="">
    <span class="count" id="count1">0</span>
    <span class="key-hint">w</span>
    <button onclick="copy(1)">copy</button>
  </div>

  <div class="row">
    <input type="text" id="label2" placeholder="label" value="">
    <span class="count" id="count2">0</span>
    <span class="key-hint">e</span>
    <button onclick="copy(2)">copy</button>
  </div>

  <div id="toast"></div>
  <input id="kb-sink" readonly tabindex="0" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0;font-size:16px;" aria-hidden="true">

  <script>
    const counts = [0, 0, 0];
    const keys = ['q', 'w', 'e'];

    const sink = document.getElementById('kb-sink');

    function handleKey(ev) {
      if (ev.target.id && ev.target.id.startsWith('label')) return;
      const i = keys.indexOf(ev.key);
      if (i !== -1) {
        counts[i]++;
        document.getElementById('count' + i).textContent = counts[i];
      } else if (ev.key === 'r') {
        counts.fill(0);
        [0, 1, 2].forEach(n => document.getElementById('count' + n).textContent = 0);
      }
    }

    document.addEventListener('keydown', handleKey);

    // iOS Safari requires a focused element to receive Bluetooth keyboard events.
    // Route focus to the sink on any tap outside a label input.
    document.addEventListener('touchend', (ev) => {
      if (!ev.target.id || !ev.target.id.startsWith('label')) sink.focus();
    });

    document.querySelectorAll('input[id^="label"]').forEach(inp => {
      inp.addEventListener('blur', () => sink.focus());
    });

    function copy(i) {
      const label = document.getElementById('label' + i).value;
      const text = counts[i] + label;
      navigator.clipboard.writeText(text);
      showToast('copied: ' + text);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.style.opacity = '0', 1500);
    }
  </script>

</body>
</html>
